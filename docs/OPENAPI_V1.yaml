openapi: 3.0.3
info:
  title: RecoverAI API
  version: 1.1.0
  description: Public API contract for auth, billing, policy governance, compliance, and tenant operations.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
  /api/auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: User and company context
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/sessions:
    get:
      summary: List active sessions for current user
      responses:
        '200':
          description: Sessions listed
  /api/auth/sessions/company:
    get:
      summary: List active sessions for company (admin/owner)
      responses:
        '200':
          description: Company sessions listed
  /api/auth/sessions/{sessionId}:
    delete:
      summary: Revoke current user session by id
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
        '404':
          $ref: '#/components/responses/Error'
  /api/auth/sessions/company/{sessionId}:
    delete:
      summary: Revoke company session by id (admin/owner)
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
  /api/auth/sessions/revoke-all:
    post:
      summary: Revoke all current user sessions
      responses:
        '200':
          description: Sessions revoked
  /api/billing/plans:
    get:
      summary: List active plans
      responses:
        '200':
          description: Plans returned
  /api/billing/subscription:
    get:
      summary: Get current company subscription
      responses:
        '200':
          description: Subscription returned
    put:
      summary: Update subscription plan/status
      responses:
        '200':
          description: Subscription updated
  /api/billing/invoices:
    get:
      summary: List billing invoices
      responses:
        '200':
          description: Billing invoices returned
  /api/billing/invoices/generate:
    post:
      summary: Generate current month billing invoice
      responses:
        '201':
          description: Billing invoice generated
  /api/billing/usage:
    get:
      summary: Get monthly usage rollups
      responses:
        '200':
          description: Usage returned
    post:
      summary: Record usage event
      responses:
        '201':
          description: Usage recorded
  /api/billing/usage/sync-recovered:
    post:
      summary: Sync recovered amount metric
      responses:
        '200':
          description: Sync completed
  /api/billing/usage/reconcile:
    post:
      summary: Reconcile usage rollups with payment ledger
      responses:
        '200':
          description: Reconciliation result
  /api/team/members:
    get:
      summary: List organization members and invitations
      responses:
        '200':
          description: Team data returned
  /api/team/invite:
    post:
      summary: Invite team member
      responses:
        '201':
          description: Invitation created
  /api/compliance/export:
    post:
      summary: Export tenant data bundle
      responses:
        '200':
          description: Export completed
  /api/compliance/delete:
    post:
      summary: Delete tenant data
      responses:
        '200':
          description: Deletion completed
  /api/policy:
    get:
      summary: Get agent policy
      responses:
        '200':
          description: Policy returned
    put:
      summary: Update agent policy
      responses:
        '200':
          description: Policy updated
  /api/policy/simulate:
    post:
      summary: Simulate policy decision
      responses:
        '200':
          description: Simulation result
  /api/policy/approvals:
    get:
      summary: List policy approval queue items
      responses:
        '200':
          description: Approval queue listed
  /api/policy/approvals/{approvalId}/decision:
    post:
      summary: Approve or reject queued policy action
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision saved
  /api/feature-flags:
    get:
      summary: List feature flags for tenant
      responses:
        '200':
          description: Flags listed
    put:
      summary: Update feature flag
      responses:
        '200':
          description: Flag updated

components:
  responses:
    Error:
      description: Standardized API error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - error
        - requestId
      properties:
        code:
          type: string
          example: REQUEST_ERROR
        error:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          example: 6f17f84b-a57a-4f4f-9dd7-a2e63d952b57


